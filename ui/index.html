/* App tile: dark fade in dark themes, light fade in light themes (also used for the window/taskbar icon, see native.js) */
:root{--tile-a:#3b2414;--tile-b:#a86f42}
[data-theme="light"],[data-theme="github"],[data-theme="sand"],[data-theme="rose"]{--tile-a:#9c6234;--tile-b:#e6c29e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:clip}
body{background:var(--bg);color:var(--text);font:12px/1.4 var(--font-ui);display:grid;grid-template-rows:auto auto 1fr 22px;user-select:none}
input,textarea,select{user-select:text}
button{font:inherit;color:inherit;cursor:default}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--thumb);border:3px solid transparent;background-clip:content-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background-color:var(--thumb-hover)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Top bar: logo, the two languages, pin, word list, settings */
.menubar{display:flex;align-items:center;gap:4px;padding:5px 6px 5px 4px;background:var(--chrome);border-bottom:1px solid var(--line);position:relative;z-index:50}
.logo{width:30px;height:28px;display:grid;place-items:center;flex:none}
.logo span{width:22px;height:22px;border-radius:22.5%;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));color:#fff;
  font-weight:800;font-size:10px;display:grid;place-items:center;letter-spacing:-.02em}
.langs{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.langs select{flex:1;min-width:0;width:0}
select{background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);height:26px;padding:0 4px;font:inherit;outline:0}
select:focus,input:focus{border-color:var(--accent)}
.ibtn{height:28px;min-width:28px;padding:0 5px;background:none;border:1px solid transparent;border-radius:var(--radius);display:inline-grid;place-items:center;flex:none;color:var(--text)}
.ibtn:hover{background:var(--hover)}
.ibtn.active{background:var(--btn-active-bg);border-color:var(--btn-active-border);color:var(--accent)}
.ibtn:disabled{opacity:.4}
.ibtn .badge{position:absolute;margin:-14px -16px 0 0;font-size:9px;min-width:14px;height:14px;border-radius:7px;background:var(--accent2);color:var(--on-accent);display:grid;place-items:center;padding:0 3px}

/* Search */
.searchbar{position:relative;padding:8px 8px 6px;background:var(--chrome2);border-bottom:1px solid var(--line);z-index:40}
.sfield{display:flex;align-items:center;gap:6px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--btn-radius);padding:0 6px 0 10px;height:34px}
.sfield:focus-within{border-color:var(--accent)}
.sfield svg{flex:none;color:var(--dim)}
#q{flex:1;min-width:0;border:0;background:none;color:var(--strong);font:inherit;font-size:15px;outline:0;height:100%}
#q::-webkit-search-cancel-button{display:none}
.translit{margin:5px 2px 0;color:var(--dim);font-size:11px}
.translit b{color:var(--strong);font-weight:600;font-size:13px}
.sugg{position:absolute;left:8px;right:8px;top:44px;background:var(--dd-bg);border:1px solid var(--dd-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 0;max-height:260px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 12px;font-size:13px}
.sugg button:hover,.sugg button.sel{background:var(--dd-hover-bg);color:var(--dd-hover-fg)}

/* Results */
.out{overflow:auto;min-height:0;padding:10px 12px 16px;user-select:text}
.wordhead{display:flex;align-items:flex-start;gap:6px;margin:2px 0 8px}
.wordhead h1{flex:1;margin:0;font-size:22px;line-height:1.2;color:var(--strong);font-weight:700;word-break:break-word}
.wordhead h1 small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:3px}
.note{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:6px 10px;margin:0 0 10px;color:var(--text)}
.note.warn{border-left-color:var(--warn)}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:calc(var(--radius) + 2px);padding:9px 11px;margin:0 0 9px}
.card.extra{background:none;border-style:dashed}
.card-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pos{font-weight:700;color:var(--strong);font-size:12px}
.tag{font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:9px;padding:0 7px;line-height:16px;white-space:nowrap}
.tag.via{color:var(--accent);border-color:var(--accent)}
.grp{margin:6px 0 2px}
.gloss{color:var(--dim);font-style:italic;font-size:11px;margin-bottom:4px}
.words{display:flex;flex-wrap:wrap;gap:5px}
.w{background:var(--seg-bg);border:1px solid var(--input-border);border-radius:var(--btn-radius);padding:3px 10px;font-size:14px;color:var(--strong);text-align:left;user-select:text}
.w:hover{border-color:var(--accent);background:var(--hover)}
.w small{color:var(--dim);font-size:10px;margin-left:5px}
ol.mean{margin:2px 0 0;padding-left:20px;line-height:1.5;font-size:13px}
ol.mean li{margin:2px 0}
ol.mean li::marker{color:var(--dim);font-size:11px}
.card.primary ol.mean{color:var(--strong)}
.lk{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted transparent}
.lk:hover{border-bottom-color:var(--accent)}
.mlabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:8px 0 2px;font-weight:600}
details.forms{margin-top:6px}
details.forms summary{color:var(--dim);font-size:11px;cursor:pointer;user-select:none}
.ftable{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin-top:5px;font-size:12px}
.ftable span{color:var(--dim)}
.ftable b{font-weight:500;color:var(--strong)}
.sources{margin-top:12px;color:var(--dim);font-size:10.5px;line-height:1.6}
.sources a{color:var(--accent);cursor:pointer}
.divider{display:flex;align-items:center;gap:8px;margin:14px 0 8px;color:var(--dim);font-size:11px}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--border)}

/* Start, list, messages */
.home{padding:6px 2px}
.home h3,.list h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600;margin:14px 0 6px;display:flex;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2px 10px;font-size:12px}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--dim);font-size:9.5px;margin-left:4px;text-transform:uppercase}
.tip{color:var(--dim);line-height:1.6;margin-top:16px;font-size:11.5px}
.tip kbd,.kbd{background:var(--code-bg);border:1px solid var(--input-border);border-radius:3px;padding:0 5px;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--strong)}
.big-tile{width:64px;height:64px;border-radius:22.5%;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;margin:10px auto 6px}
.hello{text-align:center;color:var(--dim);margin-bottom:6px}
.empty{color:var(--dim);padding:18px 6px;text-align:center;line-height:1.7}
.empty b{color:var(--strong)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid var(--border)}
.row:hover{background:var(--hover)}
.row .rw{font-size:13px;color:var(--strong)}
.row .rt{color:var(--text);font-size:12px}
.row .rl{color:var(--dim);font-size:9.5px;text-transform:uppercase;margin-left:4px}
.btn-sm{height:26px;padding:0 12px;border-radius:var(--btn-radius);border:1px solid var(--input-border);background:none;color:var(--text)}
.btn-sm:hover{background:var(--hover)}
.btn-sm.primary{background:var(--cta);border-color:var(--cta);color:var(--on-accent);font-weight:600}
.btn-sm.primary:hover{background:var(--cta-hover)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Status bar */
.status{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--chrome);border-top:1px solid var(--line);color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden}
.status .flex{flex:1}
.st-dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.st-dot.busy::before{background:var(--accent)}
.st-dot.off::before{background:var(--warn)}

/* Overlays */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:var(--dd-bg);color:var(--strong);padding:7px 14px;border-radius:var(--radius);max-width:90vw;
  border:1px solid var(--dd-border);border-left:4px solid var(--accent);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;place-items:center;z-index:200}
.modal-bg.show{display:grid}
.modal{width:calc(100vw - 16px);height:calc(100vh - 16px);display:flex;flex-direction:column;background:var(--modal-bg);border:1px solid var(--dd-border);
  border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;font-size:14px;font-weight:600;color:var(--strong);border-bottom:1px solid var(--border)}
.modal-body{overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.prefs nav{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto;flex:none}
.prefs nav button{background:none;border:0;padding:5px 10px;border-radius:var(--radius);white-space:nowrap}
.prefs nav button:hover{background:var(--hover)}
.prefs nav button.active{background:var(--dd-hover-bg);color:var(--dd-hover-fg);font-weight:600}
.prefs{display:flex;flex-direction:column;min-height:0;flex:1}
.prefs section{padding:2px 16px 20px;overflow:auto;flex:1;line-height:1.5}
.prefs h3{font-size:12px;font-weight:600;color:var(--strong);margin:16px 0 6px}
.prefs .hint{color:var(--dim);margin:-2px 0 8px;font-size:11.5px}
.prefs .wide-sel{width:100%;max-width:280px}
.switch{display:flex;align-items:center;gap:10px;margin:9px 0;cursor:pointer}
.switch input{display:none}
.switch span{width:26px;height:14px;border-radius:7px;background:var(--switch-off);position:relative;transition:.15s;flex:none}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--accent2)}
.switch input:checked+span::after{left:14px}
.hotkey{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hotkey .kbd{font-size:13px;padding:3px 10px}
.hotkey .kbd.rec{border-color:var(--accent);color:var(--accent)}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme-card{padding:0;border:2px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card-bg);text-align:left}
.theme-card:hover{border-color:var(--dim)}
.theme-card.active{border-color:var(--accent)}
.theme-name{display:flex;justify-content:space-between;padding:6px 10px;font-weight:600;color:var(--strong)}
.theme-name span{color:var(--accent)}
.tc-mock{height:70px;display:grid;grid-template-rows:14px 1fr;background:var(--bg);pointer-events:none}
.tc-bar{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 7px}
.tc-bar i{width:16px;height:4px;border-radius:2px;background:var(--dim);opacity:.7}
.tc-bar b{margin-left:auto;width:22px;height:7px;border-radius:4px;background:var(--cta)}
.tc-ed{background:var(--editor-bg);padding:6px 8px}
.tc-ed i{display:block;height:3px;border-radius:2px;margin:5px 0;background:var(--dim);opacity:.55}
.tc-ed i:first-child{background:var(--accent);opacity:1;width:40%}
.prefs .lo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
</style>
