[package]
name = "lex-studio"
version = "0.1.0"
description = "A small pop-up dictionary for translating: Latin, Ancient Greek, English, German, French, Spanish, Russian, Italian, Swedish and Japanese"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wiktionary pages (src/lookup.rs)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
unicode-normalization = "0.1"

# Dock icon that follows the theme (src/appicon.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
